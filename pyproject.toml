[project]
name = "owl-cognitive-kernel"
version = "0.2.0"
description = "Intent compiler and execution kernel for OWL. Natural language → IR → DAG → sandboxed agents → verify."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "OWL roost" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
owl-kernel = "owl_kernel.cli:main"
owl-kernel-service = "owl_kernel.service:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
